<!doctype html>
<html lang="en"><head><title>runtime grid test</title></head>
<body class="min-h-screen bg-slate-950 text-slate-200">
<div class="lg:grid lg:grid-cols-[270px_minmax(0,1fr)] xl:grid-cols-[300px_minmax(0,1fr)]">
  <aside id="side" class="hidden lg:block bg-slate-900"><h2>ERRS Diagnostics</h2></aside>
  <main id="content" class="min-w-0 w-full">
    <header><h1>Live responsive layout</h1></header>
    <div id="metrics" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
      <div class="bg-slate-800 p-5"><p>Adapter</p><h2>USB-LINK 3</h2></div>
      <div class="bg-slate-800 p-5"><p>Protocol</p><h2>J1939</h2></div>
      <div class="bg-slate-800 p-5"><p>ECM</p><h2>CM2350</h2></div>
      <div class="bg-slate-800 p-5"><p>Status</p><h2>Standby</h2></div>
    </div>
  </main>
</div>
</body></html>
