<!doctype html>
<html lang="en">
<head><title>ERRS</title></head>
<body class="antialiased min-h-screen bg-slate-950 text-white">
  <div id="outer" class="lg:flex min-h-screen">
    <aside id="sidebar" class="border-b bg-slate-900/70 lg:min-h-screen lg:w-64 lg:border-b-0 lg:border-r">
      <h1 class="bg-cyan-400 font-black tracking-tight">ERRS</h1>
      <p class="uppercase tracking-widest">diagnostics</p>
      <nav id="menu" class="lg:flex-col">
        <div class="bg-cyan-400/10 text-cyan-300">Current</div>
        <div class="hover:bg-slate-800 hover:text-white">Status</div>
      </nav>
      <p class="bg-slate-800/60 leading-5">Ready</p>
    </aside>
    <main class="min-w-0 sm:px-8 xl:px-12">
      <h2 class="text-cyan-400 tracking-tight sm:text-4xl">Calibration</h2>
      <button class="bg-cyan-400 shadow-cyan-400/10 hover:bg-cyan-300">Connect</button>
      <section id="metrics" class="grid sm:grid-cols-2 2xl:grid-cols-4 gap-4">
        <div>Metric A</div><div>Metric B</div><div>Metric C</div><div>Metric D</div>
      </section>
      <section id="content" class="grid xl:grid-cols-3">
        <div id="wide" class="xl:col-span-2">
          <div class="border-b rounded-t-md bg-cyan-500/50">Summary</div>
          <div class="border-l-2 border-cyan-400 text-cyan-400 hover:underline">Details</div>
          <div class="sm:w-60">
            <input id="search" class="placeholder:text-slate-500 focus:border-cyan-400 focus:outline-none" placeholder="Search"/>
          </div>
          <div id="scroll" class="overflow-x-auto">
            <table id="records" class="min-w-[680px]">
              <thead><tr class="bg-slate-800/60 uppercase tracking-wider"><th>ID</th><th>Status</th></tr></thead>
              <tbody class="divide-y divide-slate-800">
                <tr><td class="text-cyan-400">A</td><td class="bg-amber-400/10">Active</td></tr>
                <tr><td class="text-cyan-400">B</td><td class="bg-emerald-400/10">Idle</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <aside class="lg:grid-cols-2 sm:grid-cols-2 border-l border-t">
          <button class="bg-cyan-400 hover:bg-cyan-300">Go</button>
        </aside>
      </section>
    </main>
  </div>
</body>
</html>
