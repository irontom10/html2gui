<!doctype html>
<html lang="en">
<head><title>Optional HTML endings</title></head>
<body>
  <datalist id="machines">
    <option value="A300">
    <option value="B757">
    <option value="CM2350">
    <option value="CM2450">
  </datalist>
  <select id="powertrain">
    <option>Diesel
    <option>Natural gas
    <optgroup label="ECM">
      <option>CM2350
      <option>CM2450
    </optgroup>
    <option>Other
  </select>
  <ul id="shortlist"><li>One<li>Two<li>Three</ul>
  <dl><dt>Key<dd>Value<dt>More<dd>Another</dl>
  <p>First paragraph<p>Second paragraph</p>
  <table id="records"><tbody><tr><td>A<td>B<tr><td>C<td>D</tbody></table>
</body>
</html>
