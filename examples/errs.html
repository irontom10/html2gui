<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ERRS Diag</title>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 font-mono p-6 flex flex-col gap-4">
  <header class="flex flex-row items-center gap-6 p-4 bg-gray-900 rounded-xl border border-gray-700">
    <h1 class="text-2xl font-bold text-yellow-400">ERRS DIAG</h1>
    <span class="text-gray-400 text-sm">NATIVE GTK4 · ECM DIAGNOSTICS</span>
    <button id="connect_button" class="bg-blue-600 text-white font-semibold rounded-lg px-6 py-3">CONNECT ECM</button>
  </header>
  <main class="flex flex-col flex-1 gap-4">
    <section class="grid grid-cols-3 gap-4">
      <div class="bg-gray-800 border border-gray-700 rounded-lg p-5">
        <p class="text-xs text-gray-400">ADAPTER</p>
        <h2 class="text-lg font-bold text-white">NEXIQ USB-LINK 3</h2>
        <span class="text-emerald-400">READY</span>
      </div>
      <div class="bg-gray-800 border border-gray-700 rounded-lg p-5">
        <p class="text-xs text-gray-400">PROTOCOL</p>
        <h2 class="text-lg font-bold text-white">J1939 / RP1210</h2>
        <span class="text-emerald-400">500 KBPS</span>
      </div>
      <div class="bg-gray-800 border border-gray-700 rounded-lg p-5">
        <p class="text-xs text-gray-400">ECM</p>
        <h2 class="text-lg font-bold text-white">CM2350A</h2>
        <span class="text-yellow-400">NOT CONNECTED</span>
      </div>
    </section>
    <section class="bg-gray-800 border border-gray-700 rounded-lg p-5 flex flex-col gap-4">
      <h2 class="text-xl font-bold">ECM CALIBRATION</h2>
      <div class="flex flex-row gap-4 items-center">
        <label class="text-sm text-gray-300">CALIBRATION ID</label>
        <input id="calibration_id" type="text" placeholder="EB90128.18" class="bg-gray-900 text-white border border-gray-600 rounded-md px-3 py-2" />
        <button id="read_button" class="bg-yellow-500 text-black rounded-md font-semibold px-4 py-2">READ ECM</button>
        <button id="flash_button" class="bg-blue-600 text-white rounded-md font-semibold px-4 py-2">FLASH CAL</button>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <p class="text-xs text-gray-400">ESN</p>
          <p class="text-lg">35176054</p>
        </div>
        <div>
          <p class="text-xs text-gray-400">STATUS</p>
          <p class="text-lg text-emerald-400">STANDBY</p>
        </div>
      </div>
    </section>
    <section class="bg-gray-800 border border-gray-700 rounded-lg p-5 flex flex-col flex-1 gap-3">
      <h2 class="text-xl font-bold">DTC MONITOR</h2>
      <table class="gap-2">
        <thead><tr><th class="text-yellow-400 font-bold">SPN</th><th class="text-yellow-400 font-bold">FMI</th><th class="text-yellow-400 font-bold">STATUS</th></tr></thead>
        <tbody>
          <tr><td>3382</td><td>16</td><td class="text-emerald-400">INACTIVE</td></tr>
          <tr><td>102</td><td>3</td><td class="text-red-400">ACTIVE</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
